name: Deploy Strava Dashboard to S3

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::AWS_ACCOUNT_ID:role/GitHubStravaDashboardDeployRole
          aws-region: us-east-2

      - name: Upload website to S3
        run: |
          aws s3 sync . s3://sam-halsey.com/StravaProject \
            --delete \
            --exclude ".git/*" \
            --exclude ".github/*" \
            --exclude ".env" \
            --exclude "*.py" \
            --exclude "__pycache__/*"

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id CLOUDFRONT_DISTRIBUTION_ID \
            --paths "/StravaProject/*"